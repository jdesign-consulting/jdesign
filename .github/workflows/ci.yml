name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@9 "site/**/*.html"

      - name: Check local file references
        run: node scripts/check-assets.mjs site
